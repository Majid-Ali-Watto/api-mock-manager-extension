<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGradient)"/>
  
  <!-- API Symbol - Like brackets with connection lines -->
  <g transform="translate(24, 32)">
    <!-- Left bracket -->
    <path d="M 10 8 L 2 8 L 2 56 L 10 56" stroke="url(#lightGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Right bracket -->
    <path d="M 70 8 L 78 8 L 78 56 L 70 56" stroke="url(#lightGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Connection lines (representing data flow) -->
    <line x1="15" y1="20" x2="40" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="20" r="3" fill="#ffffff"/>
    <line x1="40" y1="20" x2="65" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3"/>
    
    <line x1="15" y1="32" x2="40" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="3" fill="#ffffff"/>
    <line x1="40" y1="32" x2="65" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3"/>
    
    <line x1="15" y1="44" x2="40" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="44" r="3" fill="#ffffff"/>
    <line x1="40" y1="44" x2="65" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3"/>
  </g>
  
  <!-- Mock badge indicator -->
  <g transform="translate(82, 82)">
    <circle cx="18" cy="18" r="20" fill="#28a745"/>
    <circle cx="18" cy="18" r="16" fill="#ffffff"/>
    <text x="18" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#28a745">M</text>
  </g>
</svg>
