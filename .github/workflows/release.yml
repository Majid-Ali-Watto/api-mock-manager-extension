# Publishes a GitHub release with the packaged extension when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match package.json / manifest.json (checked by `npm run verify`), and
# release notes come from the matching "## [x.y.z]" section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: api-mock-extension

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for [$version]"; exit 1; fi
          zip="api-mock-manager-${TAG}.zip"
          mv api-mock-extension.zip "$zip"
          gh release create "$TAG" "$zip" --title "API Mock Manager ${TAG}" --notes-file notes.md --verify-tag
