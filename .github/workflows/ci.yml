name: CI

on:
  # Every branch: master is protected (admins included) and only accepts commits
  # that already passed both checks, so push to a branch first, then to master.
  push:
    branches: ["**"]
  pull_request:
  # Reused by release.yml so a release only ships if every check passes.
  workflow_call:

# The job `name:` values below are required status checks in master's branch
# protection. Renaming a job means updating the protection rule too, or pushes
# and pull requests will wait forever for a check that never reports.
jobs:
  checks:
    name: Checks (audit, unit tests, build, verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:prod

      - name: Verify manifest, versions and package contents
        run: npm run verify
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  e2e:
    name: E2E (Chrome for Testing) + package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod

      # Branded Chrome ignores --load-extension, so the e2e suite uses Chrome for Testing.
      - name: Install Chrome for Testing
        run: npx --yes @puppeteer/browsers install chrome@stable --path .cache

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Package extension
        run: cd dist && zip -r ../api-mock-extension.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: api-mock-extension
          path: api-mock-extension.zip
